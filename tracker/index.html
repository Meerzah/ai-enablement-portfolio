<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Systems Roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f5f2;
      --surface: #ffffff;
      --ink: #141414;
      --muted: #6b6b6b;
      --line: #e6e4df;
      --accent: #0d7377;
      --accent-soft: #e6f3f3;
      --warn: #9a6b2f;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(20,20,20,.04), 0 8px 24px rgba(20,20,20,.04);
      --font: "DM Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(900px 420px at 10% -10%, #e8f4f4 0%, transparent 55%),
        radial-gradient(700px 360px at 100% 0%, #f1efe8 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { max-width: 980px; margin: 0 auto; padding: 28px 20px 72px; }
    header.top {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 16px; flex-wrap: wrap; margin-bottom: 28px;
    }
    .brand { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    h1 { font-size: clamp(1.6rem, 3vw, 2rem); font-weight: 700; letter-spacing: -.03em; margin-top: 6px; }
    .sub { color: var(--muted); margin-top: 6px; max-width: 46ch; font-size: .95rem; }
    .top-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .top-links a {
      font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none;
    }
    .top-links a:hover { border-color: var(--accent); color: var(--accent); }
    .week-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 14px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 999px; box-shadow: var(--shadow); margin-bottom: 22px;
    }
    .week-bar button, .week-bar select {
      font: inherit; border: 1px solid var(--line); background: var(--bg);
      color: var(--ink); border-radius: 999px; padding: 8px 12px; cursor: pointer;
    }
    .week-bar button:hover { border-color: var(--accent); }
    .week-bar select { min-width: 220px; }
    .pill {
      font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
    }
    .pill.muted { background: #f0efeb; color: var(--muted); }
    .pill.warn { background: #f7efdf; color: var(--warn); }
    .hero {
      background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--radius) + 4px);
      padding: 28px 28px 24px; box-shadow: var(--shadow); margin-bottom: 18px;
    }
    .hero .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .hero h2 { font-size: clamp(1.35rem, 2.4vw, 1.75rem); letter-spacing: -.03em; line-height: 1.2; }
    .hero .learn { margin-top: 10px; color: var(--muted); font-size: 1rem; max-width: 62ch; }
    .hero .time { margin-top: 14px; font-size: 13px; color: var(--muted); font-family: var(--mono); }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 11px 16px; border-radius: 999px; font-size: 14px; font-weight: 650;
      border: 1px solid transparent; text-decoration: none; cursor: pointer;
    }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: #000; text-decoration: none; }
    .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
    .grid {
      display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; margin-bottom: 14px;
    }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 20px 22px; box-shadow: var(--shadow);
    }
    .panel h3 {
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); font-weight: 700; margin-bottom: 12px;
    }
    .panel ol, .panel ul { margin: 0 0 0 18px; color: var(--ink); font-size: .94rem; }
    .panel li { margin-bottom: 8px; }
    .panel li::marker { color: var(--accent); }
    .resources { display: flex; flex-direction: column; gap: 8px; }
    .res {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--bg); text-decoration: none; color: var(--ink);
    }
    .res:hover { border-color: var(--accent); background: var(--accent-soft); text-decoration: none; }
    .res strong { font-size: .92rem; font-weight: 650; }
    .res span { font-size: 12px; color: var(--muted); font-family: var(--mono); }
    .build-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    @media (max-width: 820px) { .build-grid { grid-template-columns: 1fr; } }
    .check-list { list-style: none; margin: 0; }
    .check-list li {
      position: relative; padding: 10px 0 10px 28px; border-bottom: 1px solid var(--line);
      font-size: .94rem; color: var(--ink);
    }
    .check-list li:last-child { border-bottom: none; }
    .check-list li::before {
      content: ""; position: absolute; left: 0; top: 14px; width: 14px; height: 14px;
      border-radius: 4px; border: 1.5px solid #c9c6bf; background: #fff;
    }
    .path {
      display: inline-block; margin-top: 4px; font-family: var(--mono); font-size: 12px;
      color: var(--muted); background: var(--bg); padding: 4px 8px; border-radius: 6px;
    }
    .ship {
      display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px;
      border-top: 1px solid var(--line); font-size: .92rem; font-weight: 500;
    }
    .ship input { width: 18px; height: 18px; accent-color: var(--accent); }
    .program {
      margin-top: 8px; border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); overflow: hidden;
    }
    .program summary {
      cursor: pointer; list-style: none; padding: 16px 20px; font-weight: 650; font-size: .95rem;
    }
    .program summary::-webkit-details-marker { display: none; }
    .program-body { padding: 0 20px 18px; display: grid; gap: 8px; }
    .program-item {
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line);
      font-size: .88rem;
    }
    .program-item span { color: var(--muted); }
    footer {
      margin-top: 28px; text-align: center; color: var(--muted); font-size: 12px;
    }
    .feeds { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .feed {
      font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      padding: 4px 8px; border-radius: 6px; background: var(--ink); color: #fff;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div>
        <div class="brand">AI Systems · Agentic Ops</div>
        <h1 id="title">Weekly roadmap</h1>
        <p class="sub" id="subtitle">Theme → study → build → ship</p>
      </div>
      <div class="top-links">
        <a href="../">Home</a>
        <a href="../CURRICULUM.md">Curriculum</a>
        <a href="../projects/08-capstone-ops-agent/README.md">Flagship</a>
      </div>
    </header>

    <div class="week-bar">
      <button type="button" id="prev-week" aria-label="Previous week">←</button>
      <select id="week-select" aria-label="Select week"></select>
      <button type="button" id="next-week" aria-label="Next week">→</button>
      <span class="pill" id="week-type-pill">Mini-project</span>
      <span class="pill muted" id="progress-pill"></span>
    </div>

    <section class="hero" id="hero"></section>

    <div class="grid">
      <section class="panel">
        <h3>Study &amp; prep</h3>
        <ol id="study-list"></ol>
      </section>
      <section class="panel">
        <h3>Resources</h3>
        <div class="resources" id="resource-list"></div>
      </section>
    </div>

    <div class="build-grid">
      <section class="panel">
        <h3>Objectives</h3>
        <ul class="check-list" id="objectives-list"></ul>
      </section>
      <section class="panel">
        <h3>Build this week</h3>
        <ul class="check-list" id="build-list"></ul>
        <p class="path" id="project-path"></p>
      </section>
    </div>

    <section class="panel" style="margin-bottom:14px">
      <h3>Sub-tasks</h3>
      <div id="tasks-list" class="resources"></div>
    </section>

    <section class="panel" style="margin-bottom:14px">
      <h3>Done when</h3>
      <ul class="check-list" id="done-list"></ul>
      <label class="ship">
        <input type="checkbox" id="week-done" />
        <span>Week shipped — committed to GitHub</span>
      </label>
    </section>

    <details class="program">
      <summary>Program map</summary>
      <div class="program-body" id="program-grid"></div>
    </details>

    <footer>Progress saved in this browser · <a href="https://meerzah.github.io/ai-systems-portfolio/tracker/">Live dashboard</a></footer>
  </div>

  <script>
    let progress = {}, weeksData = {};
    let currentWeek = 1;
    let pagesBase = "";

    function weekStorageKey(week) { return `aisystems-week-${week}-done`; }
    function loadWeekDone(week) { return localStorage.getItem(weekStorageKey(week)) === "1"; }
    function saveWeekDone(week, val) { localStorage.setItem(weekStorageKey(week), val ? "1" : "0"); }

    function linkBase() {
      const local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      return local ? ".." : (pagesBase || "..").replace(/\/$/, "");
    }

    function resolveHref(raw) {
      if (!raw) return null;
      let p = String(raw).trim();
      if (p.startsWith("http")) return p;
      p = p.replace(/^(\.\.\/)+/, "").replace(/^\/+/, "");
      const base = linkBase();
      if (/\.html$/i.test(p)) return `${base}/${p}`;
      if (/\.(json|py|yml|yaml|csv)$/i.test(p)) return `${base}/${p}`;
      // Markdown + project folders → styled doc viewer
      if (/\.md$/i.test(p)) {
        return `${base}/site/doc.html?path=${encodeURIComponent(p)}`;
      }
      if (p.includes("/")) {
        const clean = p.replace(/\/$/, "");
        const mdPath = /\.md$/i.test(clean) ? clean : `${clean}/README.md`;
        return `${base}/site/doc.html?path=${encodeURIComponent(mdPath)}`;
      }
      return null;
    }

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function load() {
      [progress, weeksData] = await Promise.all([
        fetch("progress.json").then((r) => r.json()),
        fetch("weeks.json").then((r) => r.json()),
      ]);
      currentWeek = progress.currentWeek || 1;
      pagesBase = (progress.pagesBase || "").replace(/\/$/, "");
      document.getElementById("title").textContent = progress.title || "AI Systems Roadmap";
      document.getElementById("subtitle").textContent = progress.subtitle || "";
      document.getElementById("progress-pill").textContent =
        `Week ${progress.currentWeek || 1} of ${progress.weeksTotal || 36}`;
      renderProgram();
      renderWeekSelector();
      renderWeek(currentWeek);
      document.getElementById("prev-week").onclick = () => goWeek(currentWeek - 1);
      document.getElementById("next-week").onclick = () => goWeek(currentWeek + 1);
      document.getElementById("week-select").onchange = (e) => goWeek(+e.target.value);
    }

    function renderProgram() {
      document.getElementById("program-grid").innerHTML = (progress.program || []).map((p) =>
        `<div class="program-item"><strong>${esc(p.label)}</strong><span>W${esc(p.weeks)} · ${(p.competencies || []).join(" · ")}</span></div>`
      ).join("");
    }

    function renderWeekSelector() {
      document.getElementById("week-select").innerHTML = (weeksData.weeks || []).map((w) =>
        `<option value="${w.week}">Week ${w.week} — ${esc(w.theme || w.title)}</option>`
      ).join("");
    }

    function goWeek(n) {
      n = Math.max(1, Math.min(36, n));
      currentWeek = n;
      document.getElementById("week-select").value = String(n);
      renderWeek(n);
    }

    function listHtml(items, ordered) {
      const tag = ordered ? "ol" : "ul";
      if (!items || !items.length) return `<${tag}><li>See project README</li></${tag}>`;
      return items.map((x) => `<li>${esc(x)}</li>`).join("");
    }

    function renderWeek(n) {
      const w = (weeksData.weeks || []).find((x) => x.week === n);
      if (!w) return;
      const mp = w.miniProject || {};
      const typePill = document.getElementById("week-type-pill");
      if (w.phase === "capstone") { typePill.textContent = "Capstone"; typePill.className = "pill"; }
      else if (w.phase === "portfolio") { typePill.textContent = "Portfolio"; typePill.className = "pill warn"; }
      else { typePill.textContent = "Mini-project"; typePill.className = "pill"; }

      const projectHref = resolveHref(mp.path);
      const workbookHref = w.workbook || null;
      const feeds = (w.feeds || mp.feeds || []).map((f) => `<span class="feed">${esc(f)}</span>`).join("");

      const challenge = w.challenge || "";
      document.getElementById("hero").innerHTML = `
        <div class="meta">
          <span class="pill muted">Week ${n}</span>
          <span class="pill muted">${esc(w.competency || mp.competency || "")}</span>
        </div>
        <h2>${esc(w.theme || w.title)}</h2>
        <p class="learn">${esc(w.learn || "")}</p>
        ${challenge ? `<p class="learn" style="margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:#0f4f52"><strong style="color:var(--ink)">Challenge — </strong>${esc(challenge)}</p>` : ""}
        <div class="feeds">${feeds}</div>
        <p class="time">${esc(w.timeHint || progress.hoursPerWeek || "12–15 hrs")}</p>
        <div class="hero-actions">
          ${workbookHref ? `<a class="btn btn-primary" href="${esc(workbookHref)}">Open week guide →</a>` : ""}
          ${projectHref ? `<a class="btn btn-ghost" href="${esc(projectHref)}" target="_blank" rel="noopener">Open project</a>` : ""}
        </div>`;

      document.getElementById("study-list").innerHTML = listHtml(w.study, true);
      document.getElementById("objectives-list").innerHTML = listHtml(w.objectives, false);
      document.getElementById("build-list").innerHTML = listHtml(mp.build, false);
      document.getElementById("done-list").innerHTML = listHtml(mp.doneWhen, false);
      document.getElementById("project-path").textContent = mp.path || "";

      const resources = w.resources || [];
      document.getElementById("resource-list").innerHTML = resources.length
        ? resources.map((r) => {
            const href = resolveHref(r.url) || r.url;
            return `<a class="res" href="${esc(href)}" target="_blank" rel="noopener">
              <strong>${esc(r.title)}</strong><span>open</span>
            </a>`;
          }).join("")
        : `<div class="res"><strong>Curriculum</strong><span>CURRICULUM.md</span></div>`;

      const tasks = w.tasks || [];
      document.getElementById("tasks-list").innerHTML = tasks.length
        ? tasks.map((t) => {
            const primary = (t.docs && t.docs[0] && resolveHref(t.docs[0].url)) || projectHref || "#";
            const docs = (t.docs || []).map((d) => {
              const href = resolveHref(d.url) || d.url;
              return `<a href="${esc(href)}" target="_blank" rel="noopener" style="font-size:12px;font-weight:650;margin-right:10px" onclick="event.stopPropagation()">${esc(d.title || "Doc")}</a>`;
            }).join("");
            return `<a class="res" href="${esc(primary)}" target="_blank" rel="noopener" style="flex-direction:column;align-items:flex-start">
              <strong>${esc(t.title)}</strong>
              <span style="color:var(--muted);font-family:var(--font);font-size:.88rem;margin-top:4px">${esc(t.detail || "")}</span>
              ${docs ? `<div style="margin-top:8px">${docs}</div>` : ""}
            </a>`;
          }).join("")
        : `<a class="res" href="${esc(workbookHref || "#")}"><strong>Open the week guide</strong><span>step-by-step tasks</span></a>`;

      const done = loadWeekDone(n);
      const box = document.getElementById("week-done");
      box.checked = done;
      box.onchange = (e) => {
        saveWeekDone(n, e.target.checked);
      };
    }

    load().catch((err) => {
      document.getElementById("title").textContent = "Failed to load";
      document.getElementById("subtitle").textContent = err.message;
    });
  </script>
</body>
</html>
