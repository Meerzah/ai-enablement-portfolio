# Week 16 deliverable — terraform plan for Okta IaC (sandbox credentials required).
name: okta-iac-plan

on:
  pull_request:
    paths:
      - "projects/11-okta-iac/**"
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/11-okta-iac
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: projects/11-okta-iac/envs/sandbox
      - name: Terraform validate
        run: terraform validate
        working-directory: projects/11-okta-iac/envs/sandbox
