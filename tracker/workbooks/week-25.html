<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Week 25 — Capstone demo polish (2 min)</title>
<style>
:root{
  --bg:#09090b;--surface:#111113;--surface2:#18181b;--border:#27272a;
  --text:#fafafa;--muted:#a1a1aa;--accent:#6366f1;--accent2:#14b8a6;
  --success:#22c55e;--build:#818cf8;--done:#2dd4bf;--wrap:#f59e0b;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}
.side{background:var(--surface);border-right:1px solid var(--border);padding:18px 16px;display:flex;flex-direction:column;gap:14px}
@media(max-width:900px){.side{border-right:none;border-bottom:1px solid var(--border)}}
.side label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#71717a}
.side h2{font-size:15px;font-weight:650;margin-top:4px;line-height:1.3}
.back{font-size:13px;color:#818cf8;text-decoration:none}
.back:hover{text-decoration:underline}
.stat{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface2)}
.stat strong{display:block;font-size:20px;color:var(--accent2)}
.stat span{font-size:11px;color:var(--muted)}
.progress-track{height:6px;background:#27272a;border-radius:999px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
.side-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.side-actions a{
  display:block;text-align:center;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;
  text-decoration:none;border:1px solid var(--border);background:var(--surface2);color:var(--text);
}
.side-actions a.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.main{padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px;max-width:760px}
.day-row{display:flex;gap:6px;flex-wrap:wrap}
.day-btn{
  min-width:46px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
  color:#a1a1aa;font:inherit;font-size:12px;font-weight:600;cursor:pointer;position:relative;
}
.day-btn:hover{border-color:#52525b;color:#e4e4e7}
.day-btn.on{background:#1e1b4b;border-color:#4338ca;color:#fff}
.day-btn.done-day{border-color:#14532d;color:#86efac}
.day-btn.today:not(.on){box-shadow:0 0 0 1px #6366f1 inset}
.day-btn .dot{
  position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--success);
}
.focus{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:22px 24px;
  display:flex;flex-direction:column;gap:14px;min-height:280px;
}
.focus-meta{font-size:12px;color:#71717a;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.focus-meta span{color:var(--accent)}
.kind{
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;
  border:1px solid var(--border);
}
.kind.build{color:var(--build);border-color:#4338ca}
.kind.done{color:var(--done);border-color:#0f766e}
.kind.wrap{color:var(--wrap);border-color:#b45309}
.focus h1{font-size:20px;font-weight:650;line-height:1.35;letter-spacing:-.02em}
.focus p.hint{font-size:13px;color:var(--muted)}
.focus-check{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);font-size:14px;cursor:pointer;margin-top:auto;
}
.focus-check.done-box{border-color:#14532d;background:#052e16;color:#bbf7d0}
.focus-check input{width:18px;height:18px;accent-color:var(--success)}
.open-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#818cf8;text-decoration:none;font-weight:600}
.open-link:hover{text-decoration:underline}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav-row button{
  padding:11px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text);font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-width:120px;
}
.nav-row button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.nav-row button:disabled{opacity:.4;cursor:not-allowed}
.nav-center{font-size:13px;color:var(--muted);text-align:center;flex:1}
.step-dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.step-dots button{
  width:10px;height:10px;border-radius:50%;border:none;padding:0;background:#3f3f46;cursor:pointer;
}
.step-dots button.on{background:var(--accent)}
.step-dots button.done{background:var(--success)}
.buffer{
  text-align:center;padding:24px 12px;color:var(--muted);font-size:14px;
}
.buffer p{margin-bottom:12px}
</style>
</head><body>
<div class="shell">
  <aside class="side">
    <div>
      <label>Week 25 workbook</label>
      <h2>Capstone demo polish (2 min)</h2>
      <a class="back" href="../choose-layout.html">← Dashboard</a>
    </div>
    <div class="stat">
      <strong id="pct">0%</strong>
      <span id="step-count">0 of 6 steps</span>
      <div class="progress-track"><div class="progress-fill" id="bar" style="width:0%"></div></div>
    </div>
    <div class="side-actions">
      <a class="primary" href="https://meerzah.github.io/ai-systems-portfolio/projects/08-capstone-ops-agent/README.md" target="_blank" rel="noopener">Open project →</a>
      <a href="https://github.com/Meerzah/ai-systems-portfolio.git" target="_blank" rel="noopener">Clone repo</a>
    </div>
  </aside>
  <main class="main">
    <div class="day-row" id="day-row"></div>
    <section class="focus" id="focus"></section>
    <div class="step-dots" id="step-dots"></div>
    <div class="nav-row">
      <button type="button" id="prev">← Previous</button>
      <div class="nav-center" id="nav-label"></div>
      <button type="button" class="primary" id="next">Next step →</button>
    </div>
  </main>
</div>
<script>
const PLAN = {"week": 25, "title": "Capstone demo polish (2 min)", "path": "projects/08-capstone-ops-agent/", "projectHref": "https://meerzah.github.io/ai-systems-portfolio/projects/08-capstone-ops-agent/README.md", "days": [{"day": "mon", "label": "Monday", "short": "Mon", "steps": [{"id": "build-0", "text": "Rehearse demo-script.md", "kind": "build"}]}, {"day": "tue", "label": "Tuesday", "short": "Tue", "steps": [{"id": "build-1", "text": "Fix top 3 eval failures", "kind": "build"}]}, {"day": "wed", "label": "Wednesday", "short": "Wed", "steps": [{"id": "build-2", "text": "README architecture diagram", "kind": "build"}]}, {"day": "thu", "label": "Thursday", "short": "Thu", "steps": [{"id": "done-0", "text": "Demo under 2 minutes", "kind": "done"}]}, {"day": "fri", "label": "Friday", "short": "Fri", "steps": [{"id": "done-1", "text": "README diagram", "kind": "done"}]}, {"day": "sat", "label": "Saturday", "short": "Sat", "steps": []}, {"day": "sun", "label": "Sunday", "short": "Sun", "steps": [{"id": "wrap", "text": "Review the week, then mark it complete on the dashboard", "kind": "wrap"}]}]};
const PREFIX = "workbook-" + PLAN.week + "-";
const TODAY = ["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()];

let flat = [];
let cursor = 0;

function storageKey(stepId) {
  return PREFIX + stepId;
}

function isDone(stepId) {
  return localStorage.getItem(storageKey(stepId)) === "1";
}

function setDone(stepId, val) {
  localStorage.setItem(storageKey(stepId), val ? "1" : "0");
}

function buildFlat() {
  flat = [];
  PLAN.days.forEach(day => {
    if (!day.steps.length) {
      flat.push({ day: day.day, dayLabel: day.label, dayShort: day.short, empty: true });
      return;
    }
    day.steps.forEach((step, i) => {
      flat.push({
        day: day.day,
        dayLabel: day.label,
        dayShort: day.short,
        step,
        stepInDay: i + 1,
        stepsInDay: day.steps.length,
      });
    });
  });
}

function dayComplete(dayKey) {
  const day = PLAN.days.find(d => d.day === dayKey);
  if (!day || !day.steps.length) return true;
  return day.steps.every(s => isDone(s.id));
}

function syncProgress() {
  const total = flat.filter(x => x.step).length;
  const done = flat.filter(x => x.step && isDone(x.step.id)).length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("pct").textContent = pct + "%";
  document.getElementById("step-count").textContent = done + " of " + total + " steps";
  document.getElementById("bar").style.width = pct + "%";
}

function renderDayRow() {
  document.getElementById("day-row").innerHTML = PLAN.days.map(d => {
    const on = flat[cursor] && flat[cursor].day === d.day;
    const done = dayComplete(d.day);
    const today = d.day === TODAY ? " today" : "";
    const dot = done && d.steps.length ? '<i class="dot"></i>' : "";
    return `<button type="button" class="day-btn${on ? " on" : ""}${done ? " done-day" : ""}${today}" data-day="${d.day}">${d.short}${dot}</button>`;
  }).join("");
  document.querySelectorAll(".day-btn").forEach(btn => {
    btn.onclick = () => jumpToDay(btn.dataset.day);
  });
}

function renderDots() {
  const item = flat[cursor];
  if (!item || item.empty) {
    document.getElementById("step-dots").innerHTML = "";
    return;
  }
  const siblings = flat.filter(x => x.day === item.day && x.step);
  const idx = siblings.findIndex(x => x.step.id === item.step.id);
  document.getElementById("step-dots").innerHTML = siblings.map((s, i) => {
    const cls = i === idx ? "on" : isDone(s.step.id) ? "done" : "";
    return `<button type="button" class="${cls}" data-id="${s.step.id}" title="Step ${i+1}"></button>`;
  }).join("");
  document.querySelectorAll("#step-dots button").forEach(btn => {
    btn.onclick = () => {
      const target = flat.findIndex(x => x.step && x.step.id === btn.dataset.id);
      if (target >= 0) { cursor = target; renderAll(); }
    };
  });
}

function kindLabel(kind) {
  if (kind === "build") return "Build";
  if (kind === "done") return "Done when";
  return "Wrap up";
}

function renderFocus() {
  const item = flat[cursor];
  const el = document.getElementById("focus");
  if (!item) {
    el.innerHTML = "<p>No steps for this week.</p>";
    return;
  }
  if (item.empty) {
    el.innerHTML = `<div class="buffer"><p>Buffer day — nothing scheduled for <strong>${item.dayLabel}</strong>.</p><p>Use this time to catch up or read the project README.</p><a class="open-link" href="${PLAN.projectHref}" target="_blank" rel="noopener">Open project →</a></div>`;
    document.getElementById("nav-label").textContent = item.dayLabel + " · buffer day";
    document.getElementById("prev").disabled = cursor === 0;
    document.getElementById("next").disabled = cursor === flat.length - 1;
    return;
  }

  const step = item.step;
  const done = isDone(step.id);
  el.innerHTML = `
    <div class="focus-meta"><span>${item.dayLabel}</span> · Step ${item.stepInDay} of ${item.stepsInDay}</div>
    <span class="kind ${step.kind}">${kindLabel(step.kind)}</span>
    <h1>${step.text}</h1>
    <p class="hint">Work in <code style="color:#a5b4fc">${PLAN.path}</code> — check off when this step is finished.</p>
    <a class="open-link" href="${PLAN.projectHref}" target="_blank" rel="noopener">Open project folder →</a>
    <label class="focus-check${done ? " done-box" : ""}" id="check-wrap">
      <input type="checkbox" id="step-check" ${done ? "checked" : ""} />
      Mark this step complete
    </label>`;

  document.getElementById("step-check").onchange = (e) => {
    setDone(step.id, e.target.checked);
    if (e.target.checked && cursor < flat.length - 1) {
      setTimeout(() => { cursor++; renderAll(); }, 350);
    } else {
      renderAll();
    }
  };
  document.getElementById("nav-label").textContent =
    item.dayLabel + " · step " + item.stepInDay + " of " + item.stepsInDay;
  document.getElementById("prev").disabled = cursor === 0;
  document.getElementById("next").disabled = cursor === flat.length - 1;
}

function jumpToDay(dayKey) {
  const idx = flat.findIndex(x => x.day === dayKey);
  if (idx >= 0) { cursor = idx; renderAll(); }
}

function renderAll() {
  renderDayRow();
  renderFocus();
  renderDots();
  syncProgress();
}

document.getElementById("prev").onclick = () => {
  if (cursor > 0) { cursor--; renderAll(); }
};
document.getElementById("next").onclick = () => {
  if (cursor < flat.length - 1) { cursor++; renderAll(); }
};

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  if (e.key === "ArrowRight" && cursor < flat.length - 1) { cursor++; renderAll(); }
  if (e.key === "ArrowLeft" && cursor > 0) { cursor--; renderAll(); }
});

buildFlat();
const todayIdx = flat.findIndex(x => x.day === TODAY);
cursor = todayIdx >= 0 ? todayIdx : 0;
renderAll();
</script>
</body></html>
