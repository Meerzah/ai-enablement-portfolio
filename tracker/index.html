<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Systems / Agentic Ops Roadmap</title>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --surface2: #1c2129; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
      --today: #1f3a5f; --today-border: #388bfd;
      --success: #3fb950; --warn: #d29922; --purple: #a371f7; --orange: #f0883e;
      --radius: 10px; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.55; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    h1 { font-size: 1.45rem; font-weight: 650; margin: 4px 0 6px; }
    .subtitle { color: var(--muted); font-size: .95rem; margin-bottom: 16px; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .pill { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); }
    .pill.accent { border-color: var(--accent); color: var(--accent); }
    .pill.warn { border-color: var(--warn); color: var(--warn); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
    .card h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
    .project-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; background: var(--surface2); }
    .project-card h3 { font-size: 1rem; margin-bottom: 10px; color: var(--accent); }
    .project-card .phase-tag { font-size: 11px; color: var(--warn); margin-bottom: 8px; display: inline-block; }
    .project-card .phase-tag.capstone { color: var(--purple); }
    .project-card .phase-tag.portfolio { color: var(--success); }
    .project-links { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
    .project-links a {
      display: inline-block; padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-weight: 600; font-size: .88rem;
    }
    .project-links a.primary { background: var(--accent); color: #0d1117; }
    .program-grid { display: grid; gap: 8px; }
    .program-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: .88rem; }
    .program-item strong { color: var(--accent); }
    .week-nav { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .week-nav button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
    .week-nav button:hover { border-color: var(--accent); }
    .week-nav select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; }
    .day-block { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
    .day-block.today { border-color: var(--today-border); background: var(--today); }
    .day-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface2); cursor: pointer; }
    .day-block.today .day-head { background: #24364f; }
    .day-name { font-weight: 600; min-width: 36px; text-transform: capitalize; }
    .section-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--purple); }
    .section-tag.friction { color: var(--orange); }
    .section-tag.workflow { color: var(--accent); }
    .section-tag.identity { color: var(--success); }
    .section-tag.agent { color: var(--purple); }
    .section-tag.measure { color: var(--warn); }
    .section-tag.prove { color: #ff7b72; }
    .day-body { padding: 12px 14px 14px; display: none; border-top: 1px solid var(--border); }
    .day-block.open .day-body { display: block; }
    .guide { margin-bottom: 10px; font-size: .92rem; }
    .steps { margin: 0 0 10px 18px; font-size: .88rem; color: var(--muted); }
    .steps li { margin-bottom: 4px; }
    .check-row { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; font-size: .88rem; }
    .check-row input { margin-top: 4px; accent-color: var(--accent); }
    .capstone { border-left: 3px solid var(--purple); padding-left: 12px; margin-top: 8px; font-size: .9rem; }
    .prove-link { display: inline-block; margin: 8px 0; padding: 8px 12px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-size: .88rem; }
    .prove-link:hover { background: #1f3a5f; }
    .workbook-cta {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 14px; padding: 12px 14px; border-radius: var(--radius);
      background: #1f3a5f; border: 1px solid var(--today-border);
    }
    .workbook-cta a {
      display: inline-block; padding: 10px 16px; border-radius: 8px;
      background: var(--accent); color: #0d1117; text-decoration: none; font-weight: 600; font-size: .9rem;
    }
    .workbook-cta a:hover { filter: brightness(1.08); }
    .workbook-cta span { font-size: .85rem; color: var(--muted); flex: 1; min-width: 200px; }
    .how-it-works { font-size: .88rem; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
    .how-it-works strong { color: var(--text); }
    .resource-links a { color: var(--accent); margin-right: 10px; }
    .unit-list { list-style: none; }
    .unit-list li { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: .9rem; }
    .unit-list li:last-child { border-bottom: none; }
    .unit-list .active { color: var(--accent); }
    .unit-list .active > strong { font-weight: 650; }
    .unit-detail { margin-top: 8px; padding: 10px 12px; background: var(--surface2); border-radius: 8px; border: 1px solid var(--border); font-size: .85rem; }
    .unit-detail ul { margin: 6px 0 0 18px; color: var(--muted); }
    .unit-detail li { margin-bottom: 3px; }
    .unit-capstone { margin-top: 8px; font-size: 12px; color: var(--purple); }
    .unit-artifacts { margin-top: 6px; font-size: 12px; }
    footer { margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Career roadmap</p>
    <h1 id="title">Loading…</h1>
    <p class="subtitle" id="subtitle"></p>
    <div class="meta-row" id="meta-pills"></div>

    <div class="card">
      <h2>Program</h2>
      <div class="program-grid" id="program-grid"></div>
    </div>

    <div class="card">
      <h2>Current unit</h2>
      <ul class="unit-list" id="unit-list"></ul>
    </div>

    <div class="card">
      <h2>This week — mini project</h2>
      <p class="how-it-works"><strong>One build per week.</strong> Open the project folder, ship the artifact, check <em>Done when</em>, commit to GitHub, then mark the week complete.</p>
      <div class="week-nav">
        <button type="button" id="prev-week">←</button>
        <select id="week-select"></select>
        <button type="button" id="next-week">→</button>
        <span class="pill" id="week-type-pill"></span>
      </div>
      <p id="week-title" style="margin-bottom:12px;font-size:.95rem"></p>
      <div id="workbook-cta"></div>
      <div id="capstone-banner"></div>
      <div id="mini-project"></div>
    </div>

    <footer>Progress saved in browser · <a href="../">Home</a> · <a href="../CURRICULUM.md">Curriculum</a> · <a href="../projects/08-capstone-ops-agent/README.md">Capstone</a></footer>
  </div>

  <script>
    const SECTION_COLORS = {
      friction: "friction", workflow: "workflow", identity: "identity",
      agent: "agent", measure: "measure", prove: "prove"
    };
    const DAY_ORDER = ["mon","tue","wed","thu","fri","sat","sun"];
    const DAY_LABELS = { mon:"Mon", tue:"Tue", wed:"Wed", thu:"Thu", fri:"Fri", sat:"Sat", sun:"Sun" };
    const TODAY = new Date().getDay();
    const TODAY_KEY = ["sun","mon","tue","wed","thu","fri","sat"][TODAY];

    let progress = {}, weeksData = {}, monthsData = {};
    let currentWeek = 1;
    let pagesBase = "";
    let githubBase = "";

    function weekStorageKey(week) { return `aisystems-week-${week}-done`; }
    function loadWeekDone(week) { return localStorage.getItem(weekStorageKey(week)) === "1"; }
    function saveWeekDone(week, val) { localStorage.setItem(weekStorageKey(week), val ? "1" : "0"); }

    function linkBase() {
      const local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
      return local ? ".." : pagesBase;
    }

    function resolveHref(raw) {
      if (!raw) return null;
      let p = raw.trim();
      if (p.includes("(") && !p.includes("/")) return null;
      if (p.startsWith("http")) return p;
      p = p.split(/\s+\+/)[0].split(/\s+/)[0];
      const base = linkBase();
      if (/\.(md|html|json|py|tsx?|csv)$/i.test(p)) return `${base}/${p}`;
      if (p.startsWith("tracker/")) return `${base}/${p}`;
      if (p.includes("/")) return `${base}/${p.replace(/\/$/, "")}/README.md`;
      if (p.endsWith(".md")) return `${base}/${p}`;
      return null;
    }

    function linkHtml(raw, label) {
      const href = resolveHref(raw);
      const text = label || raw;
      if (!href) return `<span>${text}</span>`;
      return `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;
    }

    function parseCapstoneLinks(text) {
      if (!text) return "";
      const parts = text.split(/\s+\+\s+/);
      return parts.map(part => {
        const href = resolveHref(part);
        if (href) return `<a href="${href}" target="_blank" rel="noopener" style="color:var(--purple)">${part}</a>`;
        return part;
      }).join(" + ");
    }

    async function load() {
      [progress, weeksData, monthsData] = await Promise.all([
        fetch("progress.json").then(r => r.json()),
        fetch("weeks.json").then(r => r.json()),
        fetch("months.json").then(r => r.json())
      ]);
      currentWeek = progress.currentWeek || 1;
      pagesBase = (progress.pagesBase || "..").replace(/\/$/, "");
      githubBase = `https://github.com/${progress.repoName || "Meerzah/ai-systems-portfolio"}/blob/main`;
      renderHeader();
      renderProgram();
      renderUnits();
      renderWeekSelector();
      renderWeek(currentWeek);
      document.getElementById("prev-week").onclick = () => goWeek(currentWeek - 1);
      document.getElementById("next-week").onclick = () => goWeek(currentWeek + 1);
      document.getElementById("week-select").onchange = (e) => goWeek(+e.target.value);
    }

    function renderHeader() {
      document.getElementById("title").textContent = progress.title;
      document.getElementById("subtitle").textContent = progress.subtitle;
      const pills = [progress.careerFocus,
        `Week ${progress.currentWeek} · Phase ${progress.currentPhase}`, progress.currentUnitLabel];
      document.getElementById("meta-pills").innerHTML = pills.map((p,i) =>
        `<span class="pill ${i===0?'accent':''}">${p}</span>`).join("");
    }

    function renderProgram() {
      const items = progress.program || [];
      document.getElementById("program-grid").innerHTML = items.map(p =>
        `<div class="program-item"><strong>${p.label}</strong> (W${p.weeks})<br><span style="color:var(--muted);font-size:12px">${(p.competencies||[]).join(" · ")}</span></div>`
      ).join("");
    }

    function renderUnits() {
      const cur = progress.currentUnit || 1;
      document.getElementById("unit-list").innerHTML = (progress.units || []).map(u => {
        const isActive = u.id === cur;
        const deliverables = (u.deliverables || []).map(d => `<li>${d}</li>`).join("");
        const artifacts = (u.artifacts || []).map(a => {
          const href = resolveHref(a);
          return href
            ? `<a href="${href}" target="_blank" rel="noopener" style="color:var(--accent);margin-right:8px">${a}</a>`
            : `<span style="color:var(--muted);margin-right:8px">${a}</span>`;
        }).join("");
        const detail = isActive && (deliverables || u.capstone) ? `
          <div class="unit-detail">
            <div style="color:var(--muted);margin-bottom:4px">${u.focus}</div>
            ${deliverables ? `<strong style="font-size:12px">Deliverables</strong><ul>${deliverables}</ul>` : ""}
            ${u.capstone ? `<div class="unit-capstone">Capstone: ${parseCapstoneLinks(u.capstone)}</div>` : ""}
            ${artifacts ? `<div class="unit-artifacts">Open: ${artifacts}</div>` : ""}
          </div>` : `<br><span style="color:var(--muted);font-size:12px">${u.focus}</span>`;
        return `<li class="${isActive ? 'active' : ''}"><strong>Unit ${u.id}</strong> (W${u.weeks}) — ${u.title}${detail}</li>`;
      }).join("");
    }

    function renderWeekSelector() {
      document.getElementById("week-select").innerHTML = weeksData.weeks.map(w =>
        `<option value="${w.week}">Week ${w.week}${w.capstoneWeek ? ' ★ capstone' : ''}</option>`
      ).join("");
    }

    function goWeek(n) {
      n = Math.max(1, Math.min(36, n));
      currentWeek = n;
      document.getElementById("week-select").value = n;
      renderWeek(n);
    }

    function linkResource(r) {
      return linkHtml(r, r);
    }

    function renderWeek(n) {
      const w = weeksData.weeks.find(x => x.week === n);
      if (!w) return;
      document.getElementById("week-title").textContent = w.title;

      const wb = document.getElementById("workbook-cta");
      if (w.workbook) {
        wb.innerHTML = `<div class="workbook-cta">
          <a href="${w.workbook}">Build sheet →</a>
          <span>Track ship notes and blockers while you code.</span>
        </div>`;
      } else wb.innerHTML = "";

      const typePill = document.getElementById("week-type-pill");
      if (w.phase === "capstone") { typePill.textContent = "Capstone build"; typePill.className = "pill accent"; }
      else if (w.phase === "portfolio") { typePill.textContent = "Portfolio lane"; typePill.className = "pill warn"; }
      else { typePill.textContent = "Mini-project"; typePill.className = "pill"; }

      const capBanner = document.getElementById("capstone-banner");
      if (w.phase === "capstone") {
        capBanner.innerHTML = `<div class="capstone card" style="margin-bottom:12px"><strong>Month 6 capstone</strong> — integrate mini-projects into <a href="${resolveHref('projects/08-capstone-ops-agent/')}" target="_blank" rel="noopener" style="color:var(--purple)">projects/08-capstone-ops-agent/</a></div>`;
      } else capBanner.innerHTML = "";

      const mp = w.miniProject;
      const done = loadWeekDone(n);
      if (!mp) {
        document.getElementById("mini-project").innerHTML = "";
        return;
      }

      const projectHref = resolveHref(mp.path);
      const build = (mp.build || []).map(s => `<li>${s}</li>`).join("");
      const doneWhen = (mp.doneWhen || []).map(s => `<li>${s}</li>`).join("");

      document.getElementById("mini-project").innerHTML = `
        <div class="project-card">
          <span class="phase-tag ${w.phase || 'mini'}">${w.phase || 'mini'} · ${mp.competency || w.competency || 'build'}</span>
          <h3>${mp.name || w.title}</h3>
          <div class="project-links">
            ${projectHref ? `<a class="primary" href="${projectHref}" target="_blank" rel="noopener">Open ${mp.path} →</a>` : ""}
            ${w.workbook ? `<a href="${w.workbook}">Build sheet</a>` : ""}
          </div>
          <p style="font-size:.85rem;color:var(--muted);margin-bottom:8px"><strong style="color:var(--text)">Build this week</strong></p>
          <ul class="steps">${build}</ul>
          <p style="font-size:.85rem;color:var(--muted);margin:12px 0 8px"><strong style="color:var(--text)">Done when</strong></p>
          <ul class="steps">${doneWhen}</ul>
          <label class="check-row" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
            <input type="checkbox" id="week-done" ${done ? "checked" : ""} />
            Week ${n} shipped — committed to repo
          </label>
        </div>`;

      document.getElementById("week-done").addEventListener("change", (e) => {
        saveWeekDone(n, e.target.checked);
        renderWeek(n);
      });
    }

    load().catch(err => {
      document.getElementById("title").textContent = "Failed to load tracker data";
      document.getElementById("subtitle").textContent = err.message;
    });
  </script>
</body>
</html>
